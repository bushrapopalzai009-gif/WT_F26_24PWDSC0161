<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bushra Popalzai - Web Technologies</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            text-align: center;
            color: white;
            max-width: 600px;
        }
        .avatar {
            width: 90px;
            height: 90px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
            border: 3px solid rgba(255,255,255,0.5);
        }
        h1 { font-size: 2.2rem; margin-bottom: 0.4rem; }
        .subtitle { font-size: 1rem; opacity: 0.85; margin-bottom: 0.3rem; }
        .divider {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.3);
            margin: 1.8rem auto;
            width: 60%;
        }
        p { font-size: 1rem; opacity: 0.9; margin-bottom: 1.5rem; }
        .labs {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .lab-card {
            background: rgba(255,255,255,0.15);
            border: 1.5px solid rgba(255,255,255,0.4);
            border-radius: 10px;
            padding: 1.2rem 2rem;
            text-decoration: none;
            color: white;
            transition: background 0.2s, transform 0.15s;
            min-width: 160px;
        }
        .lab-card:hover {
            background: rgba(255,255,255,0.28);
            transform: translateY(-3px);
        }
        .lab-card .num {
            font-size: 2rem;
            font-weight: 700;
            display: block;
            margin-bottom: 0.3rem;
        }
        .lab-card .label { font-size: 0.9rem; opacity: 0.85; }
        footer {
            margin-top: 2.5rem;
            font-size: 0.85rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">👩‍💻</div>
        <h1>Bushra Popalzai</h1>
        <p class="subtitle">BS Data Science — 5th Semester</p>
        <p class="subtitle">University of Engineering and Technology, Peshawar</p>
        <hr class="divider">
        <p>CS 224L — Web Technologies Course Portfolio</p>
        <div class="labs">
            <a href="Lab 1/index.html" class="lab-card">
                <span class="num">01</span>
                <span class="label">Introduction to HTML</span>
            </a>
            <a href="Lab 2/index.html" class="lab-card">
                <span class="num">02</span>
                <span class="label">HTML & GitHub Pages</span>
            </a>
        </div>
        <footer>© 2026 Bushra Popalzai</footer>
    </div>
</body>
</html>
