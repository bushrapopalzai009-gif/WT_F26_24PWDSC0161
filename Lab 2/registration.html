<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student registration form">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Registration Form</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="profile.html">Profile</a>
            <a href="schedule.html">Schedule</a>
            <a href="navigation.html">Navigation</a>
            <a href="registration.html">Registration</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <form id="registrationForm">

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>

            <label for="regno">Registration Number:</label>
            <input type="text" id="regno" name="regno" placeholder="e.g. 24PWDSC0161" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" minlength="6" placeholder="Minimum 6 characters" required>

            <label for="course">Select Course:</label>
            <select id="course" name="course" required>
                <option value="">-- Select a Course --</option>
                <option value="web">Web Technologies</option>
                <option value="data-structures">Data Structures</option>
                <option value="algorithms">Algorithms</option>
                <option value="database">Database</option>
                <option value="statistics">Statistics</option>
                <option value="data-science">Data Science</option>
            </select>

            <div class="radio-group">
                <label>Select Semester:</label>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.4rem; margin-top:0.4rem;">
                    <div><input type="radio" id="sem1" name="semester" value="1" required><label for="sem1">1st Semester</label></div>
                    <div><input type="radio" id="sem2" name="semester" value="2"><label for="sem2">2nd Semester</label></div>
                    <div><input type="radio" id="sem3" name="semester" value="3"><label for="sem3">3rd Semester</label></div>
                    <div><input type="radio" id="sem4" name="semester" value="4"><label for="sem4">4th Semester</label></div>
                    <div><input type="radio" id="sem5" name="semester" value="5"><label for="sem5">5th Semester</label></div>
                    <div><input type="radio" id="sem6" name="semester" value="6"><label for="sem6">6th Semester</label></div>
                    <div><input type="radio" id="sem7" name="semester" value="7"><label for="sem7">7th Semester</label></div>
                    <div><input type="radio" id="sem8" name="semester" value="8"><label for="sem8">8th Semester</label></div>
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the terms and conditions.</label>
            </div>

            <button type="submit">Submit Registration</button>
            <p id="registrationMessage"></p>

        </form>

        <p style="margin-top:1.5rem;"><a href="index.html">← Back to Home</a></p>
    </main>

    <footer>
        <p>© 2026 Bushra Popalzai</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
