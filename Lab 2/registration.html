<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Student registration form">

    <title>Student Registration</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <h1>Student Registration Form</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="profile.html">Profile</a>
            <a href="schedule.html">Schedule</a>
            <a href="navigation.html">Navigation</a>
            <a href="registration.html">Registration</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <main>

        <form id="registrationForm">

            <label for="name">Full Name:</label>

            <input type="text"
                   id="name"
                   name="name"
                   required>

            <br><br>

            <label for="regno">
                Registration Number:
            </label>

            <input type="text"
                   id="regno"
                   name="regno"
                   required>

            <br><br>

            <label for="email">Email:</label>

            <input type="email"
                   id="email"
                   name="email"
                   required>

            <br><br>

            <label for="password">Password:</label>

            <input type="password"
                   id="password"
                   name="password"
                   minlength="6"
                   required>

            <br><br>

            <label for="course">
                Select Course:
            </label>

            <select id="course" name="course" required>

                <option value="">
                    -- Select a Course --
                </option>

                <option value="web">
                    Web Technologies
                </option>

                <option value="data-structures">
                    Data Structures
                </option>

                <option value="algorithms">
                    Algorithms
                </option>

                <option value="database">
                    Database
                </option>

                <option value="statistics">
                    Statistics
                </option>

            </select>

            <br><br>

            <p>Select Semester:</p>

            <input type="radio"
                   id="semester1"
                   name="semester"
                   value="1"
                   required>

            <label for="semester1">
                1st Semester
            </label>

            <br>

            <input type="radio"
                   id="semester2"
                   name="semester"
                   value="2">

            <label for="semester2">
                2nd Semester
            </label>

            <br>

            <input type="radio"
                   id="semester3"
                   name="semester"
                   value="3">

            <label for="semester3">
                3rd Semester
            </label>

            <br>

            <input type="radio"
                   id="semester4"
                   name="semester"
                   value="4">

            <label for="semester4">
                4th Semester
            </label>

            <br><br>

            <input type="checkbox"
                   id="terms"
                   name="terms"
                   required>

            <label for="terms">
                I agree to the terms and conditions.
            </label>

            <br><br>

            <button type="submit">
                Submit Registration
            </button>

            <p id="registrationMessage"></p>

        </form>

        <p>
            <a href="index.html">Back to Home</a>
        </p>

    </main>

    <footer>
        <p>© 2026 Bushra Popalzai</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
